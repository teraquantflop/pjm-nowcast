[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pjm-nowcast"
version = "1.0.0"
description = "Descriptive statistics on PJM RTO LMP, zonal LMP spreads, and RTO load."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "python-dateutil>=2.8.2",
  "tzdata>=2024.1",
  "x402[fastapi,evm,svm]>=0.2.0",
  "solana>=0.36.0,<0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
include = ["pjm_nowcast*"]

[tool.setuptools.package-data]
pjm_nowcast = ["db/schema.sql", "static/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
